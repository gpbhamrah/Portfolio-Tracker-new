name: Daily Repository Backup

on:
  schedule:
    # Runs automatically every single day at midnight
    - cron: '0 0 * * *'
  workflow_dispatch: # Lets you press a button to run it manually!

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Copy code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send copy to backup room
        run: |
          git remote add backup "https://x-access-token:${{ secrets.BACKUP_PAT }}@github.com/skbhamrah1/https://github.com/skbhamrah1/Portfolio-Tracker-Backup.git"
          git push --mirror backup
