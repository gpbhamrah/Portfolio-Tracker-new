name: Daily Repository Backup

on:
  schedule:
    # Runs automatically every single day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history, all branches, and tags

      - name: Push mirror to backup repository
        run: |
          git remote add backup "https://skbhamrah1:${{ secrets.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 }}@github.com/skbhamrah1/Portfolio-Tracker-Backup.git"
          git push --mirror backup
